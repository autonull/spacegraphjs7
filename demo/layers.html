<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Layers</title>
        <style>
            * {
                margin: 0;
                box-sizing: border-box;
            }
            body {
                font-family: ui-sans-serif, system-ui, sans-serif;
                background: #0f172a;
                color: #e2e8f0;
            }
            header {
                display: flex;
                gap: 12px;
                align-items: center;
                padding: 12px 16px;
                flex-wrap: wrap;
            }
            header h1 {
                font-size: 16px;
                font-weight: 600;
                margin-right: auto;
            }
            output {
                font-size: 13px;
                color: #94a3b8;
                min-width: 110px;
            }
            label {
                display: flex;
                gap: 8px;
                align-items: center;
                font-size: 13px;
            }
            input[type='range'] {
                accent-color: #38bdf8;
            }
            #graph {
                width: 100vw;
                height: calc(100vh - 56px);
                overflow: auto;
                background: #0b1220;
            }
            #live {
                position: absolute;
                width: 1px;
                height: 1px;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                clip-path: inset(50%);
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Layers</h1>
            <label>
                Layer
                <input id="layer" type="range" min="0" max="2" step="1" value="0" />
            </label>
            <output id="layer-label">All layers</output>
            <label>t <input id="scrub" type="range" min="0" max="1" step="0.01" value="1" /></label>
        </header>
        <div id="graph"></div>
        <div id="live" aria-live="polite"></div>
        <script type="module">
            import { defineDeriver, deriveScope, deriveZoom, diffKernels, inputToken, Kernel, runPipeline } from '@spacegraphjs/kernel';
            import { diffPositions, LaneLayout } from '@src/layout/index.ts';
            import { createRenderClock } from '@spacegraphjs/renderer';
            import { InlineGraph } from '@spacegraphjs/svg-renderer';

            const lanes = ['code', 'docs', 'run'];
            const rank = { '0': 0, '1': 1, '2': 2 };

            const node = (id, label, kind, lens, level, depth) => ({
                id,
                kind,
                label,
                data: { lens, level, depth },
            });

            const baseKernel = new Kernel({
                nodes: [
                    node('a', 'Parse', 'symbol', 'code', '0', 1),
                    node('b', 'Transform', 'symbol', 'code', '1', 3),
                    node('c', 'Emit', 'symbol', 'code', '2', 2),
                    node('d', 'Guide', 'doc', 'docs', '0', 1),
                    node('e', 'Reference', 'doc', 'docs', '1', 2),
                    node('f', 'Appendix', 'doc', 'docs', '2', 3),
                    node('g', 'Boot', 'process', 'run', '0', 1),
                    node('h', 'Watch', 'process', 'run', '1', 2),
                    node('i', 'Report', 'process', 'run', '2', 3),
                ],
                edges: [
                    { id: 'a-b', source: 'a', target: 'b', kind: 'flow' },
                    { id: 'b-c', source: 'b', target: 'c', kind: 'flow' },
                    { id: 'd-e', source: 'd', target: 'e', kind: 'flow' },
                    { id: 'e-f', source: 'e', target: 'f', kind: 'flow' },
                    { id: 'g-h', source: 'g', target: 'h', kind: 'flow' },
                    { id: 'h-i', source: 'h', target: 'i', kind: 'flow' },
                    { id: 'a-d', source: 'a', target: 'd', kind: 'link' },
                    { id: 'b-g', source: 'b', target: 'g', kind: 'link' },
                ],
                hyperedges: [],
            });

            const presets = [
                { label: 'All layers', level: '2', lens: 'all', depth: 3 },
                { label: 'Code, shallow', level: '2', lens: 'code', depth: 2 },
                { label: 'Surface', level: '0', lens: 'all', depth: 1 },
            ];

            const level = defineDeriver({
                name: 'level',
                inputs: [inputToken('level')],
                derive: (kernel, inputs) =>
                    deriveZoom(kernel, {
                        levelOf: (entry) => String(entry.data?.level ?? 0),
                        rank,
                        level: String(inputs.level),
                    }),
            });
            const lens = defineDeriver({
                name: 'lens',
                inputs: [inputToken('lens')],
                derive: (kernel, inputs) =>
                    deriveScope(kernel, (entry) => inputs.lens === 'all' || entry.data?.lens === inputs.lens),
            });
            const depth = defineDeriver({
                name: 'depth',
                inputs: [inputToken('depth')],
                derive: (kernel, inputs) =>
                    deriveScope(kernel, (entry) => Number(entry.data?.depth ?? 0) <= Number(inputs.depth)),
            });
            const derivers = [level, lens, depth];

            const place = (kernel) => {
                const layout = new LaneLayout({ lanes, lanePitch: 140, step: 220 });
                for (const lane of lanes) {
                    const items = kernel.nodes.filter((entry) => entry.data?.lens === lane);
                    if (items.length === 0) continue;
                    layout.open(lane);
                    for (const item of items) layout.place({ id: item.id, lane, group: lane });
                    layout.close(lane);
                }
                return new Map(
                    Object.entries(layout.positions).map(([id, [x, y, z]]) => [id, { x, y, z }]),
                );
            };

            const toRender = (kernel, positions) => {
                const ids = new Set(kernel.nodes.map((entry) => entry.id));
                return {
                    nodes: kernel.nodes.map((entry) => ({
                        id: entry.id,
                        kind: entry.kind,
                        label: entry.label,
                        shape: 'card',
                        position: [positions.get(entry.id).x, positions.get(entry.id).y, positions.get(entry.id).z],
                    })),
                    edges: kernel.edges.filter((edge) => ids.has(edge.source) && ids.has(edge.target)),
                };
            };

            const memo = new Map();
            let versions = { level: 1, lens: 1, depth: 1 };
            let params = presets[0];
            let previousKernel = new Kernel();
            let previousPositions;
            let currentKernel = baseKernel;
            let lastDiff = diffKernels(previousKernel, baseKernel);
            let t = 1;
            let clock;

            const container = document.getElementById('graph');
            const live = document.getElementById('live');
            const layerLabel = document.getElementById('layer-label');
            const graph = new InlineGraph(container);

            const draw = (next) => {
                t = Math.max(0, Math.min(1, next));
                graph.setModel(clock.advance(t));
                document.getElementById('scrub').value = String(t);
            };

            const show = (index) => {
                const next = presets[index];
                const nextVersions = { ...versions };
                for (const key of ['level', 'lens', 'depth']) {
                    if (next[key] !== params[key]) nextVersions[key] = versions[key] + 1;
                }
                params = next;
                versions = nextVersions;
                const kernel = runPipeline(derivers, baseKernel, params, versions, memo);
                lastDiff = diffKernels(previousKernel, kernel);
                const positions = place(kernel);
                const incremental = diffPositions(positions, previousPositions);
                const moves = [...incremental.moved.values()].map((move) => ({
                    id: move.id,
                    from: [move.from.x, move.from.y, move.from.z ?? 0],
                    to: [move.to.x, move.to.y, move.to.z ?? 0],
                }));
                previousKernel = kernel;
                previousPositions = positions;
                currentKernel = kernel;
                clock = createRenderClock(toRender(kernel, positions), moves);
                layerLabel.textContent = params.label;
                document.getElementById('layer').value = String(index);
                draw(1);
                live.textContent = params.label;
            };

            document.getElementById('layer').addEventListener('input', (event) => show(Number(event.target.value)));
            document.getElementById('scrub').addEventListener('input', (event) => draw(Number(event.target.value)));

            show(0);

            window.layersDemo = {
                setLayer(index) {
                    show(index);
                },
                draw,
                get params() {
                    return { level: params.level, lens: params.lens, depth: params.depth };
                },
                get nodeCount() {
                    return currentKernel.nodes.length;
                },
                get memoSize() {
                    return memo.size;
                },
                get diff() {
                    return {
                        added: lastDiff.nodes.added.length,
                        removed: lastDiff.nodes.removed.length,
                    };
                },
                get t() {
                    return t;
                },
                positionOf(id) {
                    return clock.advance(t).nodes.find((entry) => entry.id === id)?.position;
                },
            };
            window.addEventListener('beforeunload', () => graph.dispose());
        </script>
    </body>
</html>
