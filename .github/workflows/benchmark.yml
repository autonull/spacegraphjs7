name: SpaceGraphJS CI Benchmark & Vision Gate

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build library
              run: pnpm run build:lib

            - name: Bundle Size Audit
              run: node verification/check-bundle-size.mjs

            - name: Run Unit Tests
              run: pnpm run test

            - name: Install Playwright Browsers
              run: pnpm exec playwright install --with-deps chromium

            - name: Run Vision Gate (Playwright E2E)
              run: pnpm run test:vision
