name: CI

on:
    push:
        branches: [main]
        tags: ['v*', '@spacegraphjs/*']
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    # Tier 1: the documented developer surface. Runs before the heavier build and publish job so a
    # stale guide, export or screenshot path fails the pull request early.
    library-surface:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Build the published bytes the quickstart consumes
              run: |
                  pnpm run build:lib
                  pnpm run build:packages

            - name: Verify the library surface
              run: pnpm run verify:library

    library:
        needs: library-surface
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            # The library's own typecheck: `src`, `test` and the five leaf packages (T4.4).
            - name: Typecheck
              run: pnpm exec tsc --noEmit -p tsconfig.json

            - name: Build the published packages
              run: |
                  pnpm run build:lib
                  pnpm run build:packages

            - name: Unit tests
              run: pnpm run test

            - name: Leaf package tests
              run: |
                  for p in renderer adapter spacegraph-renderer cytoscape-renderer svg-renderer; do
                      echo "--- packages/$p ---"
                      (cd "packages/$p" && pnpm test)
                  done

            - name: Install Playwright Browsers
              run: pnpm exec playwright install --with-deps chromium

            # The complete demo: capability suite, capability gallery, programmatic showcase and
            # static pages. A broken adapter or a broken capability fails here.
            - name: Demo app
              run: |
                  pnpm --filter demo test
                  pnpm --filter demo test:e2e

            # The published surface, proven from the packed tarballs in a clean consumer outside the
            # monorepo (T4.2). A deliberately broken adapter fails here.
            - name: Publish check
              run: pnpm run test:publish

    # Timing budgets measure the code, not whatever else shares the runner. Keep this job alone:
    # no other steps run on its host while `pi scale` measures layout, vision and permalink paths.
    scale:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Build library
              run: pnpm run build:lib

            - name: Scale budgets
              run: pnpm --filter pi scale
