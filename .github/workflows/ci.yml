name: CI

on:
    push:
        branches: [main]
        tags: ['v*', '@spacegraphjs/*']
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    library:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.3'

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            # The library's own typecheck: `src`, `test` and the five leaf packages (T4.4).
            - name: Typecheck
              run: pnpm exec tsc --noEmit -p tsconfig.json

            - name: Build the published packages
              run: |
                  pnpm run build:lib
                  pnpm run build:packages

            - name: Unit tests
              run: pnpm run test

            - name: Leaf package tests
              run: |
                  for p in renderer adapter spacegraph-renderer cytoscape-renderer svg-renderer; do
                      echo "--- packages/$p ---"
                      (cd "packages/$p" && bun test)
                  done

            - name: Install Playwright Browsers
              run: pnpm exec playwright install --with-deps chromium

            # The second host (T6.12): a framework-free host outside OpenCode that runs every generic
            # module against a model of its own. A broken adapter or a broken capability fails here.
            - name: Second host
              run: pnpm exec playwright test --config playwright.demo.config.ts test/e2e/second-host.spec.ts

            # The published surface, proven from the packed tarballs in a clean consumer outside the
            # monorepo (T4.2). A deliberately broken adapter fails here.
            - name: Publish check
              run: pnpm run test:publish
