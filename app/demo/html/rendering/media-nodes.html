<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rich Media Nodes - SpaceGraphJS</title>
        <link rel="stylesheet" href="../shared-reset.css" />
        <link rel="stylesheet" href="../shared-container.css" />
        <link rel="stylesheet" href="../shared-header.css" />
        <style>

            .controls {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 10;
                background: rgba(15, 23, 42, 0.8);
                padding: 12px 24px;
                border-radius: 99px;
                display: flex;
                gap: 12px;
            }

            .btn {
                background: linear-gradient(135deg, #3b82f6, #8b5cf6);
                border: none;
                padding: 8px 16px;
                border-radius: 99px;
                color: white;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>

    <body>
        <div class="header">
            <h1>Rich Media Nodes</h1>
            <p>
                Combining 3D primitives like the Globe with CSS3D media elements like Video, Image,
                and Markdown text.
            </p>
        </div>

        <div class="controls">
            <button class="btn" id="btn-toggle-texture">Toggle Globe Texture</button>
            <button class="btn" id="btn-update-md">Update Markdown</button>
        </div>

        <div id="container"></div>

        <script type="module">
            import { SpaceGraph } from 'spacegraphjs';

            const markdownContent = `
# Global Logistics Report
## Q3 Overview

We are tracking multiple inbound shipments across the Atlantic. Key indicators show **stable performance** across the board.

* **On-time Delivery:** 94%
* **Avg Transit Time:** 12 Days
* **Active Vessels:** 18

> "The supply chain remains robust despite minor weather delays in the northern sector."
        `;

            const nodes = [
                // Textured Globe Node with markers
                {
                    id: 'earth',
                    type: 'GlobeNode',
                    position: [0, 0, 0],
                    data: {
                        radius: 120,
                        // Bundled earth texture
                        textureUrl:
                            '../../media/earth.jpg',
                        segments: 64,
                        markers: [
                            { lat: 40.7128, lng: -74.006, size: 4, color: 0xef4444 }, // NYC
                            { lat: 51.5074, lng: -0.1278, size: 4, color: 0x3b82f6 }, // London
                            { lat: 35.6895, lng: 139.6917, size: 4, color: 0x10b981 }, // Tokyo
                        ],
                    },
                },

                // Markdown Node
                {
                    id: 'report',
                    type: 'MarkdownNode',
                    position: [400, 100, 0],
                    data: {
                        width: 320,
                        markdown: markdownContent,
                        color: 'rgba(15, 23, 42, 0.9)',
                    },
                },

                // Video Node
                {
                    id: 'camera-feed',
                    type: 'VideoNode',
                    position: [-400, 100, 0],
                    data: {
                        // Bundled video clip
                        src: '../../media/feed.webm',
                        width: 320,
                        height: 180,
                        autoplay: true,
                        loop: true,
                        muted: true,
                    },
                },

                // Image Node
                {
                    id: 'satellite-img',
                    type: 'ImageNode',
                    position: [0, -250, 0],
                    data: {
                        // Bundled satellite-style image
                        url: '../../media/satellite.png',
                        width: 250,
                        height: 250,
                    },
                },
            ];

            const edges = [
                {
                    id: 'e1',
                    source: 'earth',
                    target: 'report',
                    type: 'DottedEdge',
                    data: { color: 0x8b5cf6 },
                },
                {
                    id: 'e2',
                    source: 'earth',
                    target: 'camera-feed',
                    type: 'CurvedEdge',
                    data: { color: 0x3b82f6 },
                },
                {
                    id: 'e3',
                    source: 'earth',
                    target: 'satellite-img',
                    type: 'AnimatedEdge',
                    data: { color: 0x10b981, speed: 0.01, particleColor: 0xffffff },
                },
            ];

            const sg = await SpaceGraph.create('#container', { nodes, edges });
            window.sg = sg;

            // Spin the globe slowly
            sg.events.on('render', () => {
                const earth = sg.graph.nodes.get('earth');
                if (earth && earth.object) {
                    earth.object.rotation.y += 0.002;
                }
            });

            sg.render();
            sg.fitView(150);

            // UI Controls
            let hasTexture = true;
            document.getElementById('btn-toggle-texture').addEventListener('click', () => {
                const earth = sg.graph.nodes.get('earth');
                if (earth) {
                    hasTexture = !hasTexture;
                    earth.updateSpec({
                        data: {
                            textureUrl: hasTexture
                                ? '../../media/earth.jpg'
                                : null,
                            color: 0x1e293b, // Dark blue fallback
                        },
                    });
                }
            });

            document.getElementById('btn-update-md').addEventListener('click', () => {
                const mdNode = sg.graph.nodes.get('report');
                if (mdNode) {
                    mdNode.updateSpec({
                        data: {
                            markdown:
                                mdNode.data.markdown +
                                '\n\n**Update:** New cargo ship departed from Tokyo port at 14:00 GMT.',
                        },
                    });
                }
            });
        </script>
    </body>
</html>
