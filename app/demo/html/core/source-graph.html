<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SpaceGraphJS · Source graph browser</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: ui-sans-serif, system-ui, sans-serif;
                background: #080d18;
                color: #e7ecf7;
            }
            * {
                box-sizing: border-box;
                border-radius: 0 !important;
            }
            body {
                margin: 0;
                height: 100vh;
                padding: 12px;
                display: grid;
                grid-template-rows: auto minmax(0, 1fr) auto;
                gap: 12px;
                background: #080d18;
            }
            header,
            footer {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            h1 {
                font-size: 16px;
                margin: 0 12px 0 0;
                font-weight: 600;
                letter-spacing: 0.01em;
            }
            h2 {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: #8fa3c8;
                margin: 0 0 8px;
            }
            label {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                color: #9db0d4;
            }
            select,
            input,
            button {
                font: inherit;
                font-size: 12px;
                color: #e7ecf7;
                background: #101a2e;
                border: 1px solid #2c3c60;
                padding: 7px 8px;
                min-height: 32px;
            }
            input {
                min-width: 240px;
            }
            button {
                cursor: pointer;
            }
            :focus-visible {
                outline: 2px solid #6fd6c2;
                outline-offset: 1px;
            }
            #counts {
                margin-inline-start: auto;
                color: #9db0d4;
                font-size: 12px;
                font-variant-numeric: tabular-nums;
            }
            main {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 320px;
                grid-template-rows: minmax(0, 1fr);
                gap: 12px;
                min-height: 0;
            }
            .canvas-section {
                position: relative;
                min-width: 0;
                min-height: 0;
                border: 1px solid #2c3c60;
                background: #0b1424;
            }
            #canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            #minimap {
                display: block;
                border: 1px solid #2c3c60;
                background: #0b1424;
            }
            aside {
                border: 1px solid #2c3c60;
                padding: 12px;
                overflow: auto;
                display: grid;
                gap: 14px;
                align-content: start;
            }
            #inspector {
                font-size: 13px;
                line-height: 1.5;
            }
            #inspector .title {
                font-size: 16px;
                font-weight: 600;
                word-break: break-word;
            }
            #inspector .meta {
                color: #8fa3c8;
                font-size: 12px;
                margin-block: 4px 10px;
            }
            #inspector code {
                display: block;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 12px;
                white-space: pre-wrap;
                word-break: break-word;
                padding: 8px;
                background: #0d182b;
                border-inline-start: 2px solid #6fd6c2;
            }
            #inspector h3 {
                font-size: 11px;
                text-transform: uppercase;
                color: #8fa3c8;
                margin: 12px 0 4px;
            }
            #inspector .names {
                font-size: 12px;
                color: #bcd0f0;
                word-break: break-word;
            }
            #packages {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            #packages button {
                min-height: 28px;
                padding: 4px 6px;
                font-size: 11px;
            }
            #packages button[aria-pressed='true'] {
                border-color: #6fd6c2;
                color: #6fd6c2;
            }
            footer {
                color: #9db0d4;
                font-size: 12px;
                border-top: 1px solid #1e2b47;
                padding-top: 10px;
            }
            footer span {
                margin-inline-start: auto;
            }
            footer kbd {
                border: 1px solid #2c3c60;
                padding: 1px 5px;
                font: inherit;
            }
            #evidence {
                margin: 0;
                padding: 0;
                list-style: none;
                display: flex;
                gap: 14px;
                flex-wrap: wrap;
            }
            @media (max-width: 900px) {
                main {
                    grid-template-columns: minmax(0, 1fr);
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Source graph · SpaceGraphJS API</h1>
            <label
                >Scope
                <select id="scope">
                    <option value="public">Public API</option>
                    <option value="all">All source files</option>
                </select>
            </label>
            <label
                >Detail
                <select id="detail">
                    <option value="files">Files</option>
                    <option value="symbols">Exported symbols</option>
                </select>
            </label>
            <label
                >Package
                <select id="package">
                    <option value="">All packages</option>
                </select>
            </label>
            <label
                >Search
                <input
                    id="query"
                    placeholder="Find a file, symbol or import…"
                    aria-label="Search the API"
            /></label>
            <button type="button" id="fit">Fit</button>
            <output id="counts">loading…</output>
        </header>
        <main>
            <section class="canvas-section" aria-label="Source graph canvas">
                <div id="canvas"></div>
            </section>
            <aside aria-label="Inspector">
                <div>
                    <h2>Inspector</h2>
                    <div id="inspector">Select a node to inspect its API facts.</div>
                </div>
                <div>
                    <h2>Overview</h2>
                    <svg
                        id="minimap"
                        width="240"
                        height="150"
                        role="img"
                        aria-label="Graph overview"
                    ></svg>
                </div>
                <div>
                    <h2>Packages</h2>
                    <div id="packages"></div>
                </div>
            </aside>
        </main>
        <footer>
            <ul id="evidence"></ul>
            <span><kbd>/</kbd> search · <kbd>F</kbd> fit · click a node for its API facts</span>
        </footer>
        <script type="module" src="../../source-graph.ts"></script>
    </body>
</html>
