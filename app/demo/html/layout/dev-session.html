<!doctype html>
<!-- JOB: A developer scrubs a committed prefix, travels an edge and opens an event window; proof: the replay prefix and inspector agree. -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dev session atlas — SpaceGraphJS</title>
        <link rel="stylesheet" href="../shared-reset.css" />
        <style>
            html,
            body,
            #app {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #0a0e15;
                font-family: 'SFMono-Regular', Consolas, monospace;
                color: #e7edf5;
            }
            .hud {
                position: absolute;
                z-index: 30;
                background: rgb(12 18 28 / 90%);
                border: 1px solid #223049;
                padding: 9px 14px;
                font-size: 11px;
                pointer-events: none;
                backdrop-filter: blur(8px);
            }
            .top {
                top: 14px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                align-items: center;
                gap: 10px;
                pointer-events: auto;
            }
            .top b {
                color: #7aa2f7;
            }
            .top span {
                color: #8ea0b8;
            }
            input[type='range'] {
                width: 220px;
                accent-color: #7aa2f7;
            }
            .top button {
                background: #121b29;
                color: #9fb1c9;
                border: 1px solid #28364b;
                padding: 4px 9px;
                font: inherit;
                cursor: pointer;
            }
            .inspector {
                top: 60px;
                right: 16px;
                width: 360px;
                max-height: 70vh;
                overflow: auto;
                pointer-events: auto;
            }
            .inspector h3 {
                margin: 0 0 7px;
                font-size: 13px;
                color: #7aa2f7;
            }
            .inspector .meta {
                color: #8ea0b8;
                margin-bottom: 8px;
            }
            .inspector .text {
                border-left: 2px solid #7aa2f7;
                background: #111a28;
                padding: 8px;
                line-height: 1.6;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .inspector .tools {
                display: flex;
                gap: 6px;
                margin-top: 8px;
            }
            .inspector button {
                background: #121b29;
                color: #9fb1c9;
                border: 1px solid #28364b;
                padding: 4px 9px;
                font: inherit;
                cursor: pointer;
            }
            .hint {
                bottom: 18px;
                left: 50%;
                transform: translateX(-50%);
                color: #54657d;
                text-align: center;
            }
            .event {
                container-type: inline-size;
                width: 100%;
                height: 100%;
                border: 1px solid #2b3d58;
                background: #111a28;
                display: flex;
                align-items: center;
                padding: 0 8px;
                overflow: hidden;
                font-family: var(--mono, 'SFMono-Regular', Consolas, monospace);
                font-size: clamp(9px, 6cqw, 20px);
            }
            .event[data-kind='error'],
            .event[data-status='failed'] {
                border-color: #7a3540;
            }
            .event[data-kind='approval'] {
                border-color: #7a6235;
            }
            .event .tg-gutter {
                color: #8ea0b8;
                width: 2em;
                flex: none;
            }
            .event .tg-text {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .event .tg-text code {
                color: #e0af68;
            }
            .event .tg-line-no {
                color: #41536d;
                width: 2em;
                flex: none;
            }
            .event .tg-source {
                color: #41536d;
                font-size: 0.75em;
                flex: none;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <div class="hud top">
            <b>dev session</b>
            <span id="band">detail</span>
        </div>
        <div class="hud inspector" id="atlas"></div>
        <div class="hud hint">wheel = fly through the session · arrows scrub · Enter opens a window · Escape closes it · click an edge to travel it</div>

        <script type="module">
            import '../../../../packages/domain/agent/src/atlas.css';
            import {
                atlasModel,
                atlasStats,
                atlasTravel,
                atlasVisible,
                reduceAtlas,
                replayScrubberHTML,
                sessionAtlasHTML,
            } from '../../../../packages/domain/agent/src/atlas';
            import { SpaceGraph } from 'spacegraphjs';
            import {
                terminalFacets,
                terminalLineHTML,
                terminalLODFor,
                terminalReplaySteps,
                terminalTokens,
                playTerminalReplay,
            } from 'spacegraphjs/terminal';
            import { playRepresentationChanges } from 'spacegraphjs/representations';

            const el = (id) => document.getElementById(id);
            const LADDER = ['dot', 'glyph', 'card', 'detail'];
            const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const lines = [
                ['user', 'complete', 'user', 'Refactor `router.dispatch()` and fix the failing test.', 1],
                ['assistant', 'complete', 'assistant', 'I will trace the call, patch it, then verify.', 1],
                ['tool', 'complete', 'tool', '`grep -R dispatch src/`', 1],
                ['file', 'complete', 'tool', '`src/router.ts:42` maps intents to handlers.', 1],
                ['assistant', 'complete', 'assistant', 'The failure comes from a missing default.', 1],
                ['user', 'complete', 'user', 'Patch it.', 2],
                ['file', 'complete', 'tool', '`src/router.ts` — default to `noop`.', 2],
                ['tool', 'failed', 'tool', '`bun test route.test.ts` → 1 failed', 2],
                ['error', 'failed', 'tool', '`handler` is undefined at `src/router.ts:51`.', 2],
                ['file', 'complete', 'tool', 'Add a guard before dispatch.', 2],
                ['tool', 'complete', 'tool', '`bun test route.test.ts` → 5 passed', 2],
                ['approval', 'complete', 'assistant', 'Apply the patch?', 2],
                ['user', 'complete', 'user', 'Approved. Commit.', 3],
                ['tool', 'complete', 'tool', '`git commit -m fix(router)` → `a1b2c3d`', 3],
            ].map(([kind, status, role, text, turn], index) => ({
                id: `event-${String(index + 1).padStart(2, '0')}`,
                kind,
                status,
                role,
                text,
                turn,
                at: index + 1,
                label: text.replaceAll('`', '').slice(0, 40),
                parent: index > 0 ? `event-${String(index).padStart(2, '0')}` : undefined,
            }));

            let band = 'detail';
            const renderText = (line) =>
                `<div style="display:flex;align-items:center;gap:6px;width:100%;height:64px">${terminalLineHTML(line, undefined, {
                    band,
                    ladder: LADDER,
                    tokens: terminalTokens(line.text),
                    ...(band === 'detail' ? { chrome: { lineNumber: line.at, source: `T${line.turn}` } } : {}),
                })}</div>`;

            const nodes = lines.map((line, i) => ({
                id: line.id,
                type: 'HtmlNode',
                label: line.label,
                position: [(i % 4 - 1.5) * 430, (Math.floor(i / 4) - 1.5) * 150, 0],
                data: {
                    html: renderText(line),
                    useRawHtml: true,
                    width: 380,
                    height: 64,
                    pointerEvents: 'auto',
                    backgroundColor: '#111a28',
                },
            }));
            const model = atlasModel(lines);
            const edges = model.edges.map((edge) => ({
                id: edge.id,
                source: edge.source,
                target: edge.target,
                type: edge.kind === 'failed' ? 'DottedEdge' : 'CurvedEdge',
            }));

            const frames = model.chapters
                .map((chapter) => {
                    const members = lines.filter((line) => chapter.ids.includes(line.id));
                    if (!members.length) return undefined;
                    const positions = members.map((line) => nodes.find((node) => node.id === line.id).position);
                    const xs = positions.map((p) => p[0]);
                    const ys = positions.map((p) => p[1]);
                    return {
                        id: `frame-${chapter.turn}`,
                        type: 'GroupNode',
                        label: chapter.label,
                        position: [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2, -8],
                        data: {
                            label: chapter.label,
                            width: Math.max(...xs) - Math.min(...xs) + 460,
                            height: Math.max(...ys) - Math.min(...ys) + 200,
                            depth: 18,
                            color: 0x1b2940,
                            lodThreshold: 3000,
                        },
                    };
                })
                .filter(Boolean);

            const sg = await SpaceGraph.create(
                el('app'),
                { nodes: [...nodes, ...frames], edges },
                {
                    chrome: false,
                    plugins: [],
                    render: { projection: 'orthographic', depth: 'flat', backgroundColor: 0x0a0e15 },
                },
            );
            window._sg = sg;
            sg.render();
            sg.frame(null, { duration: 0.01 });
            frames.forEach((frame) => sg.hide(frame.id));

            let atlas = {
                total: lines.length,
                prefix: lines.length,
                playing: false,
                selected: lines.at(-1).id,
            };
            let handle;
            let playback;
            window._atlas = () => atlas;

            const esc = (value) => String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');

            const render = () => {
                el('atlas').innerHTML = sessionAtlasHTML({
                    model,
                    state: atlas,
                    stats: atlasStats(lines, model.chapters, atlas.prefix),
                });
                const visible = new Set(atlasVisible(lines, atlas.prefix).map((line) => line.id));
                lines.forEach((line) => (visible.has(line.id) ? sg.show(line.id) : sg.hide(line.id)));
            };

            const openWindow = (id) => {
                const line = lines.find((entry) => entry.id === id);
                const source = sg.graph.nodes.get(id);
                const windowID = `window-${id}`;
                if (!line || !source || sg.hasNode(windowID)) return;
                sg.addNode({
                    id: windowID,
                    type: 'HtmlNode',
                    label: line.label,
                    position: [source.position.x + 220, source.position.y + 120, 20],
                    data: {
                        html: `<div style="height:120px;border:1px solid #7aa2f7;background:#111a28;padding:10px;font:13px 'SFMono-Regular',Consolas,monospace"><b>${esc(line.id)}</b><br />${terminalLineHTML(line, undefined, { band: 'detail', tokens: terminalTokens(line.text) })}<button data-sg-interactive="true" data-close="${windowID}" style="margin-top:8px;background:#1f2d41;color:#b8c8dc;border:1px solid #34506f;font:inherit">CLOSE</button></div>`,
                        useRawHtml: true,
                        width: 420,
                        height: 120,
                        pointerEvents: 'auto',
                        backgroundColor: '#111a28',
                    },
                });
            };

            const travel = (fromID, toID) => {
                const from = sg.graph.nodes.get(fromID);
                const to = sg.graph.nodes.get(toID);
                if (!from || !to) return;
                const a = { x: from.position.x, y: from.position.y };
                const b = { x: to.position.x, y: to.position.y };
                atlas = reduceAtlas(atlas, { type: 'travel', from: fromID, to: toID });
                const change = { id: `travel:${fromID}:${toID}`, from: fromID, to: toID, duration: 0.65 };
                let previous = performance.now();
                playback = playRepresentationChanges([change], (_, t) => {
                    const point = atlasTravel(a, b, t);
                    sg.center(point.x, point.y);
                }, { ease: 'power2.inOut', reducedMotion: reducedMotion() });
                const step = (now) => {
                    const dt = (now - previous) / 1000;
                    previous = now;
                    if (playback && !playback.done) {
                        playback.advance(dt);
                        requestAnimationFrame(step);
                    } else {
                        playback = undefined;
                        atlas = reduceAtlas(atlas, { type: 'arrive' });
                        render();
                    }
                };
                requestAnimationFrame(step);
            };

            const stop = () => {
                handle?.cancel();
                atlas = reduceAtlas(atlas, { type: 'stop' });
                render();
            };

            const play = () => {
                handle?.cancel();
                atlas = reduceAtlas(atlas, { type: 'play' });
                handle = playTerminalReplay(terminalReplaySteps(lines), (visible) => {
                    atlas = reduceAtlas(atlas, { type: 'prefix', value: visible.length });
                    render();
                }, {
                    intervalMs: 140,
                    reducedMotion: reducedMotion(),
                    onStep: (step, total) => { if (step === total) stop(); },
                });
            };

            sg.events.on('node:click', ({ id }) => {
                if (typeof id === 'string' && id.startsWith('event-')) {
                    atlas = reduceAtlas(atlas, { type: 'select', id });
                    render();
                }
            });
            sg.events.on('edge:click', ({ id }) => {
                const edge = model.edges.find((entry) => entry.id === id);
                if (!edge) return;
                travel(edge.source, edge.target);
                atlas = reduceAtlas(atlas, { type: 'select', id: edge.target });
                render();
            });
            sg.events.on('zoom:change', ({ zoom }) => {
                const next = terminalLODFor(zoom, LADDER);
                if (next === band) return;
                band = next;
                el('band').textContent = band;
                frames.forEach((frame) => (band === 'glyph' || band === 'card' ? sg.show(frame.id) : sg.hide(frame.id)));
                sg.update({ nodes: nodes.map((node) => ({ id: node.id, data: { html: renderText(lines.find((line) => line.id === node.id)) } })) });
            });

            el('app').addEventListener('click', (event) => {
                const close = event.target.closest?.('[data-close]');
                if (!close) return;
                sg.removeNode(close.dataset.close);
                atlas = reduceAtlas(atlas, { type: 'close' });
                render();
            });

            el('atlas').addEventListener('input', (event) => {
                if (!(event.target instanceof HTMLInputElement) || event.target.dataset.atlasScrub === undefined) return;
                handle?.cancel();
                atlas = reduceAtlas(atlas, { type: 'prefix', value: Number(event.target.value) });
                render();
            });
            el('atlas').addEventListener('click', (event) => {
                if (!(event.target instanceof HTMLElement)) return;
                const chapter = event.target.closest('[data-atlas-chapter]');
                if (chapter?.dataset.atlasChapter) {
                    const found = model.chapters.find((entry) => entry.id === chapter.dataset.atlasChapter);
                    if (found) {
                        handle?.cancel();
                        const count = lines.findIndex((line) => line.id === found.ids.at(-1)) + 1;
                        atlas = reduceAtlas(atlas, { type: 'prefix', value: count });
                        render();
                    }
                    return;
                }
                const value = event.target.closest('[data-atlas-action]')?.dataset.atlasAction;
                if (!value) return;
                const separator = value.indexOf(':');
                const kind = separator < 0 ? value : value.slice(0, separator);
                const args = separator < 0 ? [] : value.slice(separator + 1).split('|');
                if (kind === 'play') play();
                else if (kind === 'stop') stop();
                else if (kind === 'select' && args[0]) {
                    atlas = reduceAtlas(atlas, { type: 'select', id: args[0] });
                    render();
                } else if (kind === 'window' && args[0]) {
                    atlas = reduceAtlas(atlas, { type: 'window', id: args[0] });
                    render();
                    openWindow(args[0]);
                } else if (kind === 'close') {
                    if (atlas.window && sg.hasNode(`window-${atlas.window}`)) sg.removeNode(`window-${atlas.window}`);
                    atlas = reduceAtlas(atlas, { type: 'close' });
                    render();
                } else if (kind === 'travel' && args[0] && args[1]) travel(args[0], args[1]);
            });

            document.addEventListener('keydown', (event) => {
                if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
                if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
                    handle?.cancel();
                    atlas = reduceAtlas(atlas, {
                        type: 'prefix',
                        value: atlas.prefix + (event.key === 'ArrowRight' ? 1 : -1),
                    });
                    render();
                } else if (event.key === 'Enter' && atlas.selected) {
                    atlas = reduceAtlas(atlas, { type: 'window', id: atlas.selected });
                    render();
                    openWindow(atlas.selected);
                } else if (event.key === 'Escape' && atlas.window) {
                    if (sg.hasNode(`window-${atlas.window}`)) sg.removeNode(`window-${atlas.window}`);
                    atlas = reduceAtlas(atlas, { type: 'close' });
                    render();
                }
            });

            const facets = terminalFacets(lines);
            el('band').textContent = `${band} · ${[...facets].filter(([key]) => key === 'status:failed').map(([, count]) => `${count} failed`).join('')}`;
            render();
        </script>
    </body>
</html>
