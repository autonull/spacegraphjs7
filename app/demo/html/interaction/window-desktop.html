<!doctype html>
<!-- JOB: An operator switches tabs, resizes a window and sees content scale; proof: far zoom collapses the window to a title card. -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Window desktop — SpaceGraphJS</title>
        <link rel="stylesheet" href="../shared-reset.css" />
        <style>
            html,
            body,
            #app {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #0a0e15;
                font-family: 'SFMono-Regular', Consolas, monospace;
                color: #e7edf5;
            }
            .hud {
                position: absolute;
                z-index: 30;
                background: rgb(12 18 28 / 88%);
                border: 1px solid #223049;
                border-radius: 0;
                padding: 8px 14px;
                font-size: 11px;
                pointer-events: none;
                backdrop-filter: blur(8px);
            }
            .top {
                top: 14px;
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
            }
            .top b {
                color: #7aa2f7;
            }
            .top span {
                color: #8ea0b8;
            }
            .hud.taskbar {
                bottom: 14px;
                left: 50%;
                transform: translateX(-50%);
            }
            .hint {
                bottom: 14px;
                right: 18px;
                color: #54657d;
                font-size: 10px;
                text-align: right;
            }
            .resize-handle {
                border-radius: 0;
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                    animation: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <div class="hud top"><b id="band">detail</b> · <span id="info">5 windows · 4 edges</span></div>
        <div class="hud taskbar gw-taskbar" id="taskbar"></div>
        <div class="hud hint">drag a title bar · pull the corner to resize · tabs switch inner layout · click a task to focus · keys 1–4 switch tabs</div>
        <script type="module">
            import '../../../../packages/window-manager/src/graph-window.css';
            import { SpaceGraph } from 'spacegraphjs';
            import { terminalLODFor } from 'spacegraphjs/terminal';
            import { innerPlacements } from 'spacegraphjs/inspect';
            import {
                graphWindowAction,
                graphWindowHTML,
                graphWindowTaskbarHTML,
                reduceGraphWindow,
                WINDOW_BANDS,
            } from '../../../../packages/window-manager/src/graph-window';

            const el = (id) => document.getElementById(id);
            const esc = (value) =>
                String(value)
                    .replaceAll('&', '&amp;')
                    .replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;')
                    .replaceAll('"', '&quot;');
            const windows = [
                { id: 'test-failed', title: 'test failed', tone: '#f07178', status: 'FAILED', x: -420, y: -180, w: 520, h: 330, links: ['turn-5', 'incident'] },
                { id: 'turn-5', title: 'Turn 5', tone: '#7aa2f7', status: 'COMPLETE', x: 260, y: -230, w: 360, h: 220, links: ['test-failed'] },
                { id: 'incident', title: 'incident.md', tone: '#5fd0a0', status: 'COMPLETE', x: 120, y: 170, w: 380, h: 250, links: ['test-failed'] },
                { id: 'edit', title: 'edit', tone: '#e0af68', status: 'ACTION', x: -300, y: 250, w: 300, h: 170, links: ['incident'] },
                { id: 'route', title: 'router.ts', tone: '#bb9af7', status: 'FILE', x: 520, y: 80, w: 330, h: 190, links: ['turn-5'] },
            ];
            const tabs = ['detail', 'inner', 'signals', 'actions'];
            const state = new Map(
                windows.map((win) => [
                    win.id,
                    { value: { tab: 'detail', focused: false, hidden: false }, base: [win.w, win.h] },
                ]),
            );
            let band = 'detail';
            let active = windows[0].id;

            const innerWidgets = (win) => {
                const chips = Array.from({ length: 6 }, (_, i) => ({
                    id: `${win.id}-w${i}`,
                    label: `signal ${i + 1}`,
                    kind: 'signal',
                }));
                const placements = innerPlacements(chips, 'grid');
                return `<div class="gw-grid" style="position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px">${placements
                    .map(
                        ({ chip, left, top, width, height }) =>
                            `<div class="gw-tile" style="position:absolute;left:${left}%;top:${top}%;width:${width}%;height:${height}%"><b>${esc(chip.label)}</b><span>${Math.round(30 + left)}%</span><div class="gw-bar" style="width:${Math.round(20 + left)}%"></div></div>`,
                    )
                    .join('')}</div>`;
            };

            const bodyHTML = (win, tab) => {
                if (tab === 'inner') return innerWidgets(win);
                if (tab === 'signals')
                    return Array.from({ length: 4 }, (_, i) => {
                        const width = 25 + ((i * 37 + win.title.length * 11) % 70);
                        return `<div class="gw-row"><b>${esc(['latency', 'tokens', 'edges', 'focus'][i])}</b><div class="gw-bar" style="flex:1;width:auto;max-width:none;width:${width}%"></div><span>${width}</span></div>`;
                    }).join('');
                if (tab === 'actions')
                    return `<div class="gw-actions">${['center', 'trace', 'follow', 'pin', 'max', 'close']
                        .map((action) => graphWindowAction(action, win.id, action.toUpperCase()))
                        .join('')}</div><div class="gw-row" style="margin-top:6px">Window actions live inside the node.</div>`;
                return `<div class="gw-row"><b>${esc(win.status)}</b><span class="gw-pill">${win.links.length} links</span></div>
                    ${win.links.map((link) => `<div class="gw-row">· ${esc(link)}</div>`).join('')}
                    <div class="gw-actions">${graphWindowAction('center', win.id, 'CENTER')}${graphWindowAction('follow', win.id, 'FOLLOW')}</div>`;
            };

            const htmlFor = (win) => {
                const s = state.get(win.id).value;
                return graphWindowHTML({
                    id: win.id,
                    title: win.title,
                    status: win.status,
                    tone: win.tone,
                    tabs,
                    activeTab: s.tab,
                    focused: s.focused,
                    band,
                    body: (tab) => bodyHTML(win, tab),
                });
            };

            const nodes = windows.map((win) => ({
                id: win.id,
                type: 'HtmlNode',
                label: win.title,
                position: [win.x, win.y, 0],
                data: {
                    html: htmlFor(win),
                    useRawHtml: true,
                    width: win.w,
                    height: win.h,
                    minWidth: 180,
                    minHeight: 110,
                    pointerEvents: 'auto',
                    backgroundColor: '#111a28',
                    style: {},
                },
            }));
            const links = [
                ['test-failed', 'turn-5'],
                ['test-failed', 'incident'],
                ['turn-5', 'route'],
                ['incident', 'edit'],
            ].map(([source, target], i) => ({ id: `link-${i}`, source, target, type: 'CurvedEdge' }));

            const sg = await SpaceGraph.create(el('app'), { nodes, edges: links }, {
                chrome: false,
                plugins: [],
                render: { projection: 'orthographic', depth: 'flat', backgroundColor: 0x0a0e15 },
            });
            window._sg = sg;
            sg.render();
            sg.frame(null, { duration: 0.01 });

            const refresh = () => {
                sg.update({
                    nodes: windows.map((win) => ({ id: win.id, data: { html: htmlFor(win) } })),
                });
                el('taskbar').innerHTML = graphWindowTaskbarHTML(
                    windows.map((win) => {
                        const s = state.get(win.id).value;
                        return { id: win.id, title: win.title, focused: s.focused, hidden: s.hidden };
                    }),
                );
                el('taskbar').querySelectorAll('[data-gw-focus]').forEach((button) => {
                    button.addEventListener('click', () => activate(button.dataset.gwFocus));
                });
                const visible = windows.filter((win) => !state.get(win.id).value.hidden).length;
                el('info').textContent = `${visible} windows · ${links.length} edges · ${band}`;
            };

            const activate = (id) => {
                state.forEach((entry, key) => {
                    entry.value =
                        key === id
                            ? reduceGraphWindow(entry.value, { type: 'focus' })
                            : { ...entry.value, focused: false };
                });
                active = id;
                sg.show(id);
                sg.inspect(id);
                refresh();
            };

            const perform = (action, id) => {
                const entry = state.get(id);
                if (!entry) return;
                const node = sg.graph.nodes.get(id);
                if (action === 'center') sg.inspect(id);
                if (action === 'trace')
                    sg.select([id, ...windows.filter((w) => w.links.includes(id)).map((w) => w.id)]);
                if (action === 'follow') {
                    sg.select(id);
                    el('info').textContent = `following ${id}`;
                }
                if (action === 'pin') node.setPinned(!node.pinned);
                if (action === 'max') {
                    const [w, h] = entry.base;
                    const big = node.size.width > w * 1.2;
                    node.setSize(big ? w : w * 1.4, big ? h : h * 1.4);
                }
                if (action === 'close') {
                    entry.value = reduceGraphWindow(entry.value, { type: 'hide' });
                    sg.hide(id);
                    refresh();
                    return;
                }
                activate(id);
            };

            el('app').addEventListener('click', (event) => {
                const button = event.target.closest?.('[data-gw-action]');
                if (!button) return;
                event.stopPropagation();
                const action = button.dataset.gwAction;
                const id = button.dataset.gwWindow;
                const entry = state.get(id);
                if (!entry) return;
                if (action.startsWith('tab:')) {
                    entry.value = reduceGraphWindow(entry.value, { type: 'tab', tab: action.slice(4) });
                    active = id;
                    refresh();
                    return;
                }
                perform(action, id);
            });

            document.addEventListener('keydown', (event) => {
                const index = Number(event.key) - 1;
                if (!Number.isInteger(index) || index < 0 || index >= tabs.length) return;
                const entry = state.get(active);
                entry.value = reduceGraphWindow(entry.value, { type: 'tab', tab: tabs[index] });
                refresh();
            });

            sg.events.on('zoom:change', ({ zoom }) => {
                const next = terminalLODFor(zoom, WINDOW_BANDS);
                if (next === band) return;
                band = next;
                el('band').textContent = band;
                refresh();
            });
            sg.events.on('node:resized', ({ node, size }) => {
                el('info').textContent = `${node.id} resized to ${Math.round(size.width)}×${Math.round(size.height)} · content scales`;
            });

            refresh();
        </script>
    </body>
</html>
