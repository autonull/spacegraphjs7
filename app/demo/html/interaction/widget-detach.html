<!doctype html>
<!-- JOB: An operator detaches a widget and reattaches it; proof: the contains edge appears and disappears with the node. -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Widget detach — SpaceGraphJS</title>
        <link rel="stylesheet" href="../shared-reset.css" />
        <style>
            html,
            body,
            #app {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #0a0e15;
                font-family: 'SFMono-Regular', Consolas, monospace;
                color: #e7edf5;
            }
            .hud {
                position: absolute;
                z-index: 30;
                background: rgb(12 18 28 / 88%);
                border: 1px solid #223049;
                border-radius: 0;
                padding: 8px 14px;
                font-size: 11px;
                pointer-events: none;
                backdrop-filter: blur(8px);
            }
            .top {
                top: 14px;
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
            }
            .top b {
                color: #7aa2f7;
            }
            .top span {
                color: #8ea0b8;
            }
            .hint {
                bottom: 18px;
                left: 50%;
                transform: translateX(-50%);
                color: #54657d;
                text-align: center;
            }
            .hostwin {
                container-type: inline-size;
                width: 100%;
                height: 100%;
                border: 1px solid #34506f;
                border-radius: 0;
                background: linear-gradient(150deg, #142033, #0d1624);
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            .hostwin .cap {
                padding: 6px 9px;
                border-bottom: 1px solid #26354c;
                font-size: clamp(10px, 5cqw, 20px);
                font-weight: 700;
                letter-spacing: 0.04em;
                color: #dce6f4;
            }
            .hostwin .cap span {
                float: right;
                color: #8ea0b8;
                font-weight: 400;
                font-size: 0.75em;
            }
            .field {
                position: relative;
                flex: 1;
                min-height: 0;
            }
            .widget {
                position: absolute;
                border: 1px solid #2b3d58;
                border-radius: 0;
                background: #1a2637;
                padding: 3px 5px;
                overflow: hidden;
                font-size: clamp(8px, 3.6cqw, 14px);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            .widget b {
                color: #dce6f4;
                font-weight: 600;
            }
            .widget .value {
                color: #7aa2f7;
                font-size: 1.25em;
            }
            .widget button {
                position: absolute;
                right: 3px;
                top: 3px;
                background: #22324a;
                color: #8ea0b8;
                border: 1px solid #34506f;
                border-radius: 0;
                font: inherit;
                font-size: 0.85em;
                padding: 0 4px;
                cursor: pointer;
            }
            .widget button:hover {
                color: #7aa2f7;
                border-color: #7aa2f7;
            }
            .spark {
                height: 3px;
                border-radius: 0;
                background: linear-gradient(90deg, #7aa2f7 60%, #2b3d58 60%);
            }
            .widget-card {
                container-type: inline-size;
                width: 100%;
                height: 100%;
                border: 1px solid #7aa2f7;
                border-radius: 0;
                background: #162033;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 6px 9px;
                font-size: clamp(9px, 9cqw, 20px);
            }
            .widget-card b {
                color: #dce6f4;
            }
            .widget-card .value {
                color: #5fd0a0;
                font-size: 1.2em;
            }
            .widget-card button {
                align-self: flex-start;
                background: #22324a;
                color: #8ea0b8;
                border: 1px solid #34506f;
                border-radius: 0;
                font: inherit;
                font-size: 0.7em;
                padding: 1px 5px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <div class="hud top"><b id="state">6 widgets enfolded</b><br /><span id="detail">detach a widget to promote it into the graph</span></div>
        <div class="hud hint">click ↗ on a widget · drag detached cards · click REATTACH to fold them back</div>

        <script type="module">
            import { Vector3 } from 'three';
            import { SpaceGraph } from 'spacegraphjs';
            import { innerPlacements } from 'spacegraphjs/inspect';

            const el = (id) => document.getElementById(id);
            const esc = (value) => String(value).replaceAll('<', '&lt;').replaceAll('&', '&amp;').replaceAll('"', '&quot;');
            const widgetDefs = [
                { id: 'latency', label: 'latency', value: '42ms' },
                { id: 'tokens', label: 'tokens', value: '1.8k' },
                { id: 'edges', label: 'edges', value: '18' },
                { id: 'focus', label: 'focus', value: '0.92' },
                { id: 'health', label: 'health', value: '17/18' },
                { id: 'replay', label: 'replay', value: '3/5' },
            ];
            const placements = innerPlacements(widgetDefs, 'grid');
            const detached = new Map();
            let hostSize = [620, 430];

            const hostHTML = () => `<div class="hostwin" style="height:${hostSize[1]}px">
                <div class="cap">session dashboard <span>${widgetDefs.length - detached.size} inner widgets</span></div>
                <div class="field">${placements
                    .map(({ chip, left, top, width, height }) => {
                        const hidden = detached.has(chip.id);
                        return `<div class="widget" data-widget="${chip.id}" style="left:${left}%;top:${top}%;width:${width}%;height:${height}%;${hidden ? 'visibility:hidden' : ''}">
                            <button data-sg-interactive="true" data-action="detach" data-id="${chip.id}">↗</button>
                            <b>${esc(chip.label)}</b><div class="value">${esc(chip.value ?? chip.label)}</div>
                            <div class="spark"></div>
                        </div>`;
                    })
                    .join('')}</div>
            </div>`;

            const cardHTML = (widget, size = [210, 130]) => `<div class="widget-card" style="height:${size[1]}px"><b>${esc(widget.label)}</b><span class="value">${esc(widget.value)}</span>
                <button data-sg-interactive="true" data-action="reattach" data-id="${widget.id}">REATTACH</button></div>`;

            const sg = await SpaceGraph.create(
                el('app'),
                {
                    nodes: [
                        {
                            id: 'dashboard',
                            type: 'HtmlNode',
                            label: 'session dashboard',
                            position: [0, 0, 0],
                            data: {
                                html: hostHTML(),
                                useRawHtml: true,
                                width: 620,
                                height: 430,
                                minWidth: 260,
                                minHeight: 180,
                                pointerEvents: 'auto',
                                backgroundColor: '#111a28',
                                style: {},
                            },
                        },
                    ],
                    edges: [],
                },
                {
                    chrome: false,
                    plugins: [],
                    render: { projection: 'orthographic', depth: 'flat', backgroundColor: 0x0a0e15 },
                },
            );
            window._sg = sg;
            sg.render();
            sg.frame(null, { duration: 0.01 });

            const worldOf = (clientX, clientY) => {
                const point = new Vector3(
                    (clientX / window.innerWidth) * 2 - 1,
                    -(clientY / window.innerHeight) * 2 + 1,
                    0,
                );
                point.unproject(sg.camera);
                return [point.x, point.y, 0];
            };

            const updateHost = () => {
                sg.update({ nodes: [{ id: 'dashboard', data: { html: hostHTML() } }] });
                el('state').textContent = `${widgetDefs.length - detached.size} widgets enfolded`;
                el('detail').textContent = `${detached.size} promoted to graph nodes · ${detached.size} contains edges`;
            };

            el('app').addEventListener('click', (event) => {
                const button = event.target.closest?.('[data-action]');
                if (!button) return;
                const id = button.dataset.id;
                const widget = widgetDefs.find((entry) => entry.id === id);
                if (!widget) return;
                event.stopPropagation();

                if (button.dataset.action === 'detach' && !detached.has(id)) {
                    const chip = button.closest('[data-widget]');
                    const rect = chip.getBoundingClientRect();
                    const position = worldOf(rect.left + rect.width / 2, rect.top + rect.height / 2);
                    const rank = detached.size;
                    const lifted = [330 + rank * 60, 60 - rank * 40, 0];
                    detached.set(id, lifted);
                    sg.addNode({
                        id: `widget-${id}`,
                        type: 'HtmlNode',
                        label: widget.label,
                        position: lifted,
                        data: {
                            html: cardHTML(widget),
                            useRawHtml: true,
                            width: 210,
                            height: 130,
                            pointerEvents: 'auto',
                            backgroundColor: '#162033',
                            minWidth: 140,
                            minHeight: 90,
                            style: {},
                        },
                    });
                    sg.addEdge({
                        id: `contains-${id}`,
                        source: 'dashboard',
                        target: `widget-${id}`,
                        type: 'DottedEdge',
                    });
                    updateHost();
                }

                if (button.dataset.action === 'reattach' && detached.has(id)) {
                    sg.removeEdge(`contains-${id}`);
                    sg.removeNode(`widget-${id}`);
                    detached.delete(id);
                    updateHost();
                }
            });

            sg.events.on('node:resized', ({ node, size }) => {
                if (node.id !== 'dashboard') return;
                hostSize = [size.width, size.height];
                updateHost();
            });
            sg.events.on('node:click', ({ id }) => {
                if (typeof id === 'string' && id.startsWith('widget-')) {
                    sg.inspect(id);
                }
            });
        </script>
    </body>
</html>
