<!doctype html>
<!-- JOB: An operator detaches a widget and reattaches it; proof: the contains edge appears and disappears with the node. -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Widget detach — SpaceGraphJS</title>
        <link rel="stylesheet" href="../shared-reset.css" />
        <style>
            html,
            body,
            #app {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #0a0e15;
                font-family: 'SFMono-Regular', Consolas, monospace;
                color: #e7edf5;
            }
            .hud {
                position: absolute;
                z-index: 30;
                background: rgb(12 18 28 / 88%);
                border: 1px solid #223049;
                border-radius: 0;
                padding: 8px 14px;
                font-size: 11px;
                pointer-events: none;
                backdrop-filter: blur(8px);
            }
            .top {
                top: 14px;
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
            }
            .top b {
                color: #7aa2f7;
            }
            .top span {
                color: #8ea0b8;
            }
            .hint {
                bottom: 18px;
                left: 50%;
                transform: translateX(-50%);
                color: #54657d;
                text-align: center;
            }
            .hostwin {
                container-type: inline-size;
                width: 100%;
                height: 100%;
                border: 1px solid #34506f;
                border-radius: 0;
                background: linear-gradient(150deg, #142033, #0d1624);
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            .hostwin .cap {
                padding: 6px 9px;
                border-bottom: 1px solid #26354c;
                font-size: clamp(10px, 5cqw, 20px);
                font-weight: 700;
                letter-spacing: 0.04em;
                color: #dce6f4;
            }
            .hostwin .cap span {
                float: right;
                color: #8ea0b8;
                font-weight: 400;
                font-size: 0.75em;
            }
            .field {
                position: relative;
                flex: 1;
                min-height: 0;
            }
            .field .inner-widgets {
                height: 100%;
                aspect-ratio: auto;
            }
            .inner-widget[data-kind='artifact'] {
                border-left-color: #5fd0a0;
            }
            .widget-card {
                container-type: inline-size;
                width: 100%;
                height: 100%;
                border: 1px solid #7aa2f7;
                border-radius: 0;
                background: #162033;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 6px 9px;
                font-size: clamp(9px, 9cqw, 20px);
            }
            .widget-card b {
                color: #dce6f4;
            }
            .widget-card .value {
                color: #5fd0a0;
                font-size: 1.2em;
            }
            .widget-card button {
                align-self: flex-start;
                background: #22324a;
                color: #8ea0b8;
                border: 1px solid #34506f;
                border-radius: 0;
                font: inherit;
                font-size: 0.7em;
                padding: 1px 5px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <div class="hud top"><b id="state">6 widgets enfolded</b><br /><span id="detail">detach a widget to promote it into the graph</span></div>
        <div class="hud hint">click ↗ on a widget · drag detached cards · click REATTACH to fold them back</div>

        <script type="module">
            import '../../../../packages/domain/agent/src/inner-widget.css';
            import {
                innerWidgetEdgeID,
                innerWidgetHTML,
                innerWidgetNodeID,
                innerWidgetStats,
                reduceInnerWidgets,
            } from '../../../../packages/domain/agent/src/inner-widget';
            import { SpaceGraph } from 'spacegraphjs';
            import { innerPlacements } from 'spacegraphjs/inspect';

            const el = (id) => document.getElementById(id);
            const esc = (value) => String(value).replaceAll('<', '&lt;').replaceAll('&', '&amp;').replaceAll('"', '&quot;');
            const widgetDefs = [
                { id: 'latency', label: 'latency', value: '42ms' },
                { id: 'tokens', label: 'tokens', value: '1.8k' },
                { id: 'edges', label: 'edges', value: '18' },
                { id: 'focus', label: 'focus', value: '0.92' },
                { id: 'health', label: 'health', value: '17/18' },
                { id: 'replay', label: 'replay', value: '3/5' },
            ];
            const model = {
                container: 'dashboard',
                items: innerPlacements(widgetDefs, 'grid').map(({ chip, left, top, width, height }) => ({
                    id: chip.id,
                    label: chip.label,
                    kind: 'artifact',
                    detail: String(chip.value ?? chip.label),
                    x: left,
                    y: top,
                    width,
                    height,
                })),
            };
            let innerState = { folded: false, detached: [] };
            const lifted = new Map();
            let hostSize = [620, 430];
            window._inner = () => innerState;

            const hostHTML = () => {
                const stats = innerWidgetStats(model, innerState);
                return `<div class="hostwin" style="height:${hostSize[1]}px">
                    <div class="cap">session dashboard <span>${stats.shown} inner widgets</span></div>
                    <div class="field">${innerWidgetHTML({ model, state: innerState, stats })}</div>
                </div>`;
            };

            const cardHTML = (widget, size = [210, 130]) => `<div class="widget-card" style="height:${size[1]}px"><b>${esc(widget.label)}</b><span class="value">${esc(widget.value)}</span>
                <button data-sg-interactive="true" data-inner-action="reattach:${esc(widget.id)}">REATTACH</button></div>`;

            const sg = await SpaceGraph.create(
                el('app'),
                {
                    nodes: [
                        {
                            id: 'dashboard',
                            type: 'HtmlNode',
                            label: 'session dashboard',
                            position: [0, 0, 0],
                            data: {
                                html: hostHTML(),
                                useRawHtml: true,
                                width: 620,
                                height: 430,
                                minWidth: 260,
                                minHeight: 180,
                                pointerEvents: 'auto',
                                backgroundColor: '#111a28',
                                style: {},
                            },
                        },
                    ],
                    edges: [],
                },
                {
                    chrome: false,
                    plugins: [],
                    render: { projection: 'orthographic', depth: 'flat', backgroundColor: 0x0a0e15 },
                },
            );
            window._sg = sg;
            sg.render();
            sg.frame(null, { duration: 0.01 });

            const updateHost = () => {
                sg.update({ nodes: [{ id: 'dashboard', data: { html: hostHTML() } }] });
                el('state').textContent = `${innerWidgetStats(model, innerState).shown} widgets enfolded`;
                el('detail').textContent = `${innerState.detached.length} promoted to graph nodes · ${innerState.detached.length} contains edges`;
            };

            document.addEventListener('click', (event) => {
                const value = event.target.closest?.('[data-inner-action]')?.dataset.innerAction;
                if (!value) return;
                event.stopPropagation();
                const separator = value.indexOf(':');
                const kind = separator < 0 ? value : value.slice(0, separator);
                const id = separator < 0 ? '' : value.slice(separator + 1);
                const widget = widgetDefs.find((entry) => entry.id === id);

                if (kind === 'fold' || kind === 'unfold' || kind === 'toggle') {
                    innerState = reduceInnerWidgets(innerState, { type: kind });
                    updateHost();
                    return;
                }
                if (!widget) return;
                if (kind === 'detach' && !innerState.detached.includes(id)) {
                    const rank = lifted.size;
                    const position = [330 + rank * 60, 60 - rank * 40, 0];
                    const nodeID = innerWidgetNodeID(model.container, id);
                    lifted.set(id, position);
                    sg.addNode({
                        id: nodeID,
                        type: 'HtmlNode',
                        label: widget.label,
                        position,
                        data: {
                            html: cardHTML(widget),
                            useRawHtml: true,
                            width: 210,
                            height: 130,
                            pointerEvents: 'auto',
                            backgroundColor: '#162033',
                            minWidth: 140,
                            minHeight: 90,
                            style: {},
                        },
                    });
                    sg.addEdge({
                        id: innerWidgetEdgeID(model.container, id),
                        source: model.container,
                        target: nodeID,
                        type: 'DottedEdge',
                    });
                    innerState = reduceInnerWidgets(innerState, { type: 'detach', id });
                    updateHost();
                    return;
                }
                if (kind === 'reattach' && innerState.detached.includes(id)) {
                    sg.removeEdge(innerWidgetEdgeID(model.container, id));
                    sg.removeNode(innerWidgetNodeID(model.container, id));
                    lifted.delete(id);
                    innerState = reduceInnerWidgets(innerState, { type: 'reattach', id });
                    updateHost();
                }
            });

            sg.events.on('node:resized', ({ node, size }) => {
                if (node.id !== 'dashboard') return;
                hostSize = [size.width, size.height];
                updateHost();
            });
            sg.events.on('node:click', ({ id }) => {
                if (typeof id === 'string' && id.startsWith('inner:dashboard:')) {
                    sg.inspect(id);
                }
            });
            document.addEventListener('keydown', (event) => {
                if (
                    event.target instanceof HTMLInputElement ||
                    event.target instanceof HTMLTextAreaElement
                )
                    return;
                if (event.key === 'f') {
                    innerState = reduceInnerWidgets(innerState, { type: 'toggle' });
                    updateHost();
                } else if (event.key === 'Escape' && innerState.detached.length) {
                    const id = innerState.detached.at(-1);
                    if (!id) return;
                    sg.removeEdge(innerWidgetEdgeID(model.container, id));
                    sg.removeNode(innerWidgetNodeID(model.container, id));
                    lifted.delete(id);
                    innerState = reduceInnerWidgets(innerState, { type: 'reattach', id });
                    updateHost();
                }
            });
        </script>
    </body>
</html>
