<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SpaceGraphJS</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            :focus-visible {
                outline: 2px solid #60a5fa;
                outline-offset: 2px;
            }
            body {
                background: #0d0d0d;
                color: #eee;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                overflow: hidden;
            }
            #menu {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 40px;
                background: #111;
                border-bottom: 1px solid #222;
                display: flex;
                align-items: center;
                padding: 0 16px;
                gap: 8px;
                z-index: 10000;
            }
            #menu select {
                background: #1a1a1a;
                border: 1px solid #333;
                color: #ccc;
                padding: 6px 12px;
                border-radius: 4px;
                font-size: 13px;
                cursor: pointer;
            }
            #menu select:hover {
                border-color: #8b5cf6;
            }
            #app {
                width: 100vw;
                height: calc(100vh - 40px);
                margin-top: 40px;
            }

            /* Glassmorphism Classes */
            .glass {
                background: rgba(255, 255, 255, 0.05) !important;
                backdrop-filter: blur(12px) !important;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                border-radius: 16px !important;
                color: white !important;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }

            .circle-node {
                border-radius: 50% !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                text-align: center !important;
            }

            @keyframes pulse-blue {
                0% {
                    box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4);
                }
                70% {
                    box-shadow: 0 0 0 10px rgba(59, 130, 246, 0);
                }
                100% {
                    box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
                }
            }
            .pulse-card {
                animation: pulse-blue 2s infinite;
            }
        </style>
    </head>
    <body>
        <div id="menu">
            <select id="demo-select" aria-label="Select demo"></select>
            <input
                type="text"
                id="demo-search"
                aria-label="Search demos"
                placeholder="Search demos..."
                style="
                    background: #1a1a1a;
                    border: 1px solid #333;
                    color: #ccc;
                    padding: 6px 12px;
                    border-radius: 4px;
                    font-size: 13px;
                    margin-left: 10px;
                "
            />
            <span
                id="demo-title"
                style="
                    color: #666;
                    font-size: 12px;
                    margin-left: 15px;
                    font-weight: 500;
                    letter-spacing: 0.05em;
                    text-transform: uppercase;
                "
            ></span>
            <div
                id="vision-health"
                style="
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    margin-right: 20px;
                    font-size: 11px;
                    font-weight: 600;
                "
            >
                <div
                    id="health-indicator"
                    style="width: 8px; height: 8px; border-radius: 50%; background: #666"
                ></div>
                <span id="health-label" style="color: #666">AI VISION: OPTIONAL</span>
            </div>
            <div style="flex-grow: 1"></div>
            <a
                href="learn.html#capabilities"
                style="
                    color: #8b5cf6;
                    text-decoration: none;
                    font-size: 12px;
                    font-weight: 600;
                    margin-right: 10px;
                "
                >Visual Gallery</a
            >
            <a
                href="learn.html"
                style="color: #8b5cf6; text-decoration: none; font-size: 12px; font-weight: 600"
                >How it works</a
            >
        </div>
        <div id="app"></div>

        <script type="module">
            import { SpaceGraph } from 'spacegraphjs';
            import { CATEGORIES } from './src/registry';

            const DEMOS = import.meta.glob('./demos/**/*.ts', { eager: true });

            const demoList = Object.keys(DEMOS)
                .map((path) => {
                    const parts = path.split('/');
                    const name = parts.pop().replace('.ts', '');
                    const mod = DEMOS[path];
                    return { name, group: parts.pop() ?? 'core', create: mod.default || mod };
                })
                .sort(
                    (a, b) =>
                        a.group.localeCompare(b.group) || a.name.localeCompare(b.name),
                );

            let currentDemo = null;

            const select = document.getElementById('demo-select');
            const title = document.getElementById('demo-title');

            function updateSelect(filter = '') {
                const previous = select.value;
                select.innerHTML = '';
                const filtered = demoList.filter((d) =>
                    `${d.name} ${d.group}`.toLowerCase().includes(filter.toLowerCase()),
                );

                const groups = new Map();
                for (const demo of filtered) {
                    if (!groups.has(demo.group)) groups.set(demo.group, []);
                    groups.get(demo.group).push(demo);
                }
                for (const [group, entries] of groups) {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = CATEGORIES[group] ?? group;
                    optgroup.append(
                        ...entries.map((d) => {
                            const opt = document.createElement('option');
                            opt.value = d.name;
                            opt.textContent = d.name;
                            return opt;
                        }),
                    );
                    select.appendChild(optgroup);
                }
                if (!filtered.length) {
                    const option = document.createElement('option');
                    option.disabled = true;
                    option.textContent = 'No demos match';
                    select.append(option);
                }
                if (filtered.some((d) => d.name === previous)) select.value = previous;
                return filtered;
            }

            updateSelect();

            async function loadDemo(name) {
                const demo = demoList.find((d) => d.name === name);
                const app = document.getElementById('app');
                if (!demo) {
                    app.textContent = `Unknown demo: ${name}`;
                    window.__DEMO_READY = true;
                    return;
                }

                window.__DEMO_READY = false;
                title.textContent = demo.name;
                const loading = document.createElement('p');
                loading.textContent = `Loading ${demo.name}…`;
                app.replaceChildren(loading);

                currentDemo?.stop?.();
                currentDemo?.dispose?.();
                currentDemo = undefined;

                try {
                    currentDemo = await demo.create();
                    loading.remove();
                    setTimeout(() => {
                        window.__DEMO_READY = true;
                        console.log(`Demo "${name}" is ready.`);
                    }, 500);
                } catch (error) {
                    app.replaceChildren(
                        Object.assign(document.createElement('p'), {
                            textContent: `Could not load ${demo.name}: ${error instanceof Error ? error.message : String(error)}`,
                        }),
                    );
                    window.__DEMO_READY = true;
                }
            }

            select.addEventListener('change', (e) => {
                const url = new URL(window.location.href);
                url.searchParams.set('demo', e.target.value);
                window.history.pushState({}, '', url);
                loadDemo(e.target.value);
            });

            document
                .getElementById('demo-search')
                .addEventListener('input', (e) => updateSelect(e.target.value));

            const params = new URLSearchParams(window.location.search);
            const initialDemo = params.get('demo') || 'system-architecture';
            select.value = initialDemo;
            void loadDemo(initialDemo);

            window.addEventListener('popstate', () => {
                const name =
                    new URLSearchParams(window.location.search).get('demo') || 'system-architecture';
                if (select.value !== name) select.value = name;
                void loadDemo(name);
            });

            window.SpaceGraph = SpaceGraph;

            // Vision health indicator loop
            const indicator = document.getElementById('health-indicator');
            const label = document.getElementById('health-label');

            setInterval(async () => {
                const sg = window._sg || currentDemo?.sg;
                if (!sg || !sg.vision) return;

                if (!sg.vision.modelsLoaded) {
                    label.textContent = 'AI VISION: LOADING MODELS...';
                    indicator.style.background = '#f59e0b';
                    return;
                }

                try {
                    const report = await sg.vision.analyzeVision();
                    const score = report.overall.score;
                    label.textContent = `AI VISION: ${score}% HEALTHY`;

                    if (score >= 90) indicator.style.background = '#10b981';
                    else if (score >= 70) indicator.style.background = '#f59e0b';
                    else indicator.style.background = '#ef4444';
                } catch (e) {
                    // Silently fail if analysis is already in progress
                }
            }, 5000);
        </script>
    </body>
</html>
